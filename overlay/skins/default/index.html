<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing - Default</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/skins/default/style.css">
</head>

<body>
    <main class="now-playing-card">

        <div id="track-content" class="track-content">

            <!-- Album artwork -->
            <div class="album-art-container">
                <img id="album-art" class="album-art" src="" alt="Album artwork">
            </div>

            <!-- Track information -->
            <section class="track-info">
                <h1 id="title">Waiting for music</h1>
                <p id="artist">Start playing something</p>
            </section>

        </div>

        <!-- Playback progress -->
        <section class="playback">
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>

            <div class="time">
                <span id="position">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </section>

    </main>

    <script src="/gsap.min.js"></script>
    <script src="/utils.js"></script>
    <script src="/skins/default/skin.js"></script>
    <script src="/app.js"></script>

</body>
</html>
